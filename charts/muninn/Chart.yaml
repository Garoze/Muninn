apiVersion: v2
name: muninn
description: Kubernetes-native runtime configuration resolver
type: application
# Bumped whenever anything under charts/ changes, independently of the
# application's own version below.
version: 0.2.2
# The application version this chart deploys by default. Stamped at package
# time from the release being published, so a published chart always states
# the release it shipped with; the value here is the fallback for a chart
# built straight from the working tree.
appVersion: "0.2.2"
# livenessProbe.grpc (both Deployments) went GA in 1.27; the -0 suffix
# matters - without it, prerelease-shaped version strings from managed
# distributions fail the constraint for no good reason.
kubeVersion: ">=1.27.0-0"
home: https://github.com/Garoze/Muninn
sources:
  - https://github.com/Garoze/Muninn
# Both opt-in, default off - see the cert-manager/secrets-store-csi-driver
# blocks in values.yaml for what each condition controls and why default-off
# matters. Versions pinned deliberately, matching this repo's own
# unpinned-@latest-is-unacceptable convention (see ci.yml).
dependencies:
  - name: cert-manager
    version: v1.21.1
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
  - name: secrets-store-csi-driver
    version: "1.6.0"
    repository: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
    condition: secrets-store-csi-driver.enabled
