apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: muninn-manager
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: muninn-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: muninn-manager
subjects:
  - kind: ServiceAccount
    name: muninn
    namespace: {{ .Release.Namespace }}
