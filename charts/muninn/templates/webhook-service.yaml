{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: muninn-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app: muninn-webhook
spec:
  type: ClusterIP
  selector:
    app: muninn-webhook
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
{{- end }}
