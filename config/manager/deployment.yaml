apiVersion: apps/v1
kind: Deployment
metadata:
  name: muninn
  namespace: muninn-system
  labels:
    app: muninn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: muninn
  template:
    metadata:
      labels:
        app: muninn
    spec:
      serviceAccountName: muninn
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: muninn
          image: &muninnImage localhost/muninn:latest
          imagePullPolicy: Never
          args: ["serve"]
          env:
            # Same value as this container's own image, above - anchored
            # so the two can't drift out of sync. The webhook stamps this
            # into the init container/sidecar it injects into opted-in
            # Pods, since Kubernetes has no fieldRef for a container's own
            # image.
            - name: MUNINN_INJECT_IMAGE
              value: *muninnImage
          ports:
            - name: grpc
              containerPort: 5010
              protocol: TCP
            - name: grpc-health
              containerPort: 5011
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            grpc:
              port: 5011
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 5011
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
