apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: muninn-webhook-cert
  namespace: muninn-system
spec:
  secretName: muninn-webhook-tls
  dnsNames:
    - muninn-webhook.muninn-system.svc
    - muninn-webhook.muninn-system.svc.cluster.local
  issuerRef:
    name: muninn-webhook-selfsigned
    kind: Issuer
