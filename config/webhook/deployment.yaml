apiVersion: apps/v1
kind: Deployment
metadata:
  name: muninn-webhook
  namespace: muninn-system
  labels:
    app: muninn-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: muninn-webhook
  template:
    metadata:
      labels:
        app: muninn-webhook
    spec:
      serviceAccountName: muninn-webhook
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: muninn-webhook
          # NOTE: must match config/manager/deployment.yaml's image by hand -
          # kubectl apply -f treats the two files independently, so nothing
          # keeps this in sync automatically.
          image: localhost/muninn:latest
          imagePullPolicy: Never
          args: ["webhook"]
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: MUNINN_INJECT_IMAGE
              value: localhost/muninn:latest
            - name: MUNINN_SELF_ADDR
              value: muninn.muninn-system.svc.cluster.local:5010
            - name: SECRET_SPC_MODE
              value: Create
            - name: VAULT_ADDRESS
              value: http://vault.kube-system:8200
            - name: VAULT_ROLE_NAME
              value: muninn
          # Probes speak HTTPS because the webhook serves nothing else; the
          # kubelet does not verify the certificate for probes.
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Gated on informer cache sync: until it completes, this replica
          # admits annotated Pods without injecting into them, so it must stay
          # out of the Service's endpoints rather than serve admission early.
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: webhook-tls
              mountPath: /etc/webhook/certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: webhook-tls
          secret:
            secretName: muninn-webhook-tls
