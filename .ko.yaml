# Must be the multi-platform index digest rather than a per-platform child
# manifest - ko can only build the platforms its base image offers.
defaultBaseImage: gcr.io/distroless/static@sha256:f7f8f729987ad0fdf6b05eeeae94b26e6a0f613bdf46feea7fc40f7bd72953e6
defaultPlatforms:
  - linux/amd64
  - linux/arm64
builds:
  - id: muninn
    dir: .
    main: ./cmd/muninn
    ldflags:
      - -s
      - -w
      - -X github.com/garoze/muninn/internal/version.Version={{.Env.VERSION}}
