syntax = "proto3";

package discovery.v1;

option go_package = "github.com/garoze/muninn/gen/discovery/v1;discoveryv1";

import "google/protobuf/struct.proto";

// DiscoveryService provides namespace-scoped runtime configuration lookup.
//
// Watches Kubernetes ConfigMaps (and, optionally, other registered config
// sources) via controller-runtime informers, maintains a patch-based
// in-memory cache keyed by namespace, and serves whatever keys are present
// in the resolved configuration.
service DiscoveryService {
  // Query returns configuration values for the specified namespace and keys.
  rpc Query(QueryRequest) returns (QueryResponse);

  // Describe lists the active configuration sources.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Resolve returns everything currently resolved for a namespace - no keys
  // enumerated up front. Backs the webhook's init container/sidecar, which
  // don't know ahead of time what keys exist; Query stays keys-in/keys-out
  // for callers (muninnctl) who do.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
}

message QueryRequest {
  string namespace = 1;     // REQUIRED. Namespace to resolve configuration for.
  repeated string keys = 2; // Keys to fetch. An empty list resolves nothing;
                            // use Resolve to retrieve everything.
  bool strict = 3;          // If true, any missing key returns InvalidArgument.
}

message QueryResponse {
  repeated KeyValue values = 1;
  repeated string missing_keys =
      2;               // Populated when strict=false and keys are absent.
  string revision = 3; // Cache revision token, useful for debugging.
}

message KeyValue {
  string key = 1;
  google.protobuf.Value value = 2;
  string source = 3; // Which config source (e.g. ConfigMap name) this value was
                     // resolved from.
}

message DescribeRequest {}

message DescribeResponse { repeated ConfigSource sources = 1; }

message ConfigSource {
  string kind = 1;           // e.g. "ConfigMap"
  string label_selector = 2; // Selector scoping which objects are watched.
  string scope = 3;          // e.g. "namespace"
}

message ResolveRequest {
  string namespace = 1; // REQUIRED
}

message ResolveResponse {
  repeated KeyValue values = 1;
  string revision = 2; // Same cache revision token Query returns
}
