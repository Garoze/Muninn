version: 2
updates:
  # Actions are pinned to commit SHAs so that a moved or compromised tag cannot
  # reach the workflow holding the publishing identity. A pin nobody updates
  # only trades that risk for a stale one, so the two ship together.
  - package-ecosystem: github-actions
    directory: /
    # Dependabot targets the default branch unless told otherwise, and main is
    # the released branch: a bump merged there is invisible to develop until
    # the next back-merge, and reaches a release without CI or an alpha having
    # run the workflows it changes.
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    # One PR for all of them: these move together and each is a SHA bump with
    # the same review question.
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # This prefix is what keeps a routine bump out of the changelog and
    # proposes no release.
    commit-message:
      prefix: "chore(deps)"
    # Grouped where the modules are released as a set: a pull request moving
    # one member alone does not build.
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/controller-runtime"
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
