<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Muninn logo</title>
  <desc>The name Muninn written in Younger Futhark runes with latin transliteration below</desc>

  <style>
    .rune { font-family: serif; font-size: 72px; font-weight: 400; fill: #f5f5f5; letter-spacing: 20px; }
    .label { font-family: sans-serif; font-size: 14px; font-weight: 400; fill: #aaaaaa; letter-spacing: 8px; }
  </style>

  <text x="340" y="120" text-anchor="middle" class="rune">ᛘᚢᚾᛁᚾ</text>
  <text x="340" y="160" text-anchor="middle" class="label">muninn</text>
</svg>
