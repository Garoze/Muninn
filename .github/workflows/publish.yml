name: publish
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.4.0 or v0.4.0-alpha.3)"
        required: true
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # inputs.tag is only set when this workflow is dispatched explicitly,
      # not on a direct tag push
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install ko
        run: go install github.com/google/ko@v0.19.1
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.4
      # GHCR requires a lowercase path; github.repository is "Garoze/Muninn"
      # verbatim, which is an invalid OCI reference if used as-is
      - name: lowercase image repository
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "CHARTS=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/charts" >> "$GITHUB_ENV"
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # :latest is reserved for an official release cut on main - an alpha
      # tag from develop always carries -alpha., never gets it
      - name: determine image tags
        id: tags
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAGS="$TAG"
          if [[ "$TAG" != *-alpha.* ]]; then
            TAGS="$TAGS,latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      # Platforms come from .ko.yaml's defaultPlatforms, not repeated here.
      # --image-refs writes one line (first tag + the digest all requested
      # tags share) - that digest, not any tag, is what gets signed next.
      - name: build and push
        id: build
        env:
          KO_DOCKER_REPO: ${{ env.IMAGE }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          ko build ./cmd/muninn --bare --sbom=none \
            --tags="${{ steps.tags.outputs.tags }}" --image-refs=ko-image-refs.txt \
            --image-label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --image-label org.opencontainers.image.description="Kubernetes-native runtime configuration resolver" \
            --image-label org.opencontainers.image.licenses=MIT
          echo "digest=$(cut -d@ -f2 ko-image-refs.txt)" >> "$GITHUB_OUTPUT"
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      # Signs the digest this build step actually produced, not the tag -
      # steps.build.outputs.digest is what makes that possible
      - name: sign the image digest
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
      # Proves the workflow's own signature is verifiable before calling the
      # job done, not just producing a signature and trusting it's correct
      - name: verify the pushed signature
        run: |
          cosign verify ${{ env.IMAGE }}@${{ steps.build.outputs.digest }} \
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/publish.yml@${{ github.ref }}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      # These repos are only needed to vendor the opt-in subchart archives
      # into the package below - the chart's own version is independent of
      # this tag and comes from Chart.yaml, unrelated to the image tags above.
      - name: register subchart repositories
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
      - name: fetch chart dependencies
        run: helm dependency build charts/muninn
      # helm push has no --image-refs equivalent, so the digest to sign is
      # parsed from its own stdout instead of a written file.
      - name: package and push chart
        id: chart
        run: |
          helm package charts/muninn -d /tmp
          version=$(helm show chart charts/muninn | awk -F': ' '/^version:/{print $2}')
          output=$(helm push "/tmp/muninn-${version}.tgz" oci://${{ env.CHARTS }} 2>&1 | tee /dev/stderr)
          digest=$(echo "$output" | grep -oP 'Digest: \Ksha256:[0-9a-f]+')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: sign the chart digest
        run: cosign sign --yes ${{ env.CHARTS }}/muninn@${{ steps.chart.outputs.digest }}
      - name: verify the pushed chart signature
        run: |
          cosign verify ${{ env.CHARTS }}/muninn@${{ steps.chart.outputs.digest }} \
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/publish.yml@${{ github.ref }}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
