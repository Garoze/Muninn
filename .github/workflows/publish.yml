name: publish
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.4.0 or v0.4.0-alpha.3)"
        required: true
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # inputs.tag is only set when this workflow is dispatched explicitly,
      # not on a direct tag push
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # GHCR requires a lowercase path; github.repository is "Garoze/Muninn"
      # verbatim, which is an invalid OCI reference if used as-is
      - name: lowercase image repository
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      # :latest is reserved for an official release cut on main - an alpha
      # tag from develop always carries -alpha., never gets it
      - name: determine image tags
        id: tags
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAGS="${{ env.IMAGE }}:$TAG"
          if [[ "$TAG" != *-alpha.* ]]; then
            TAGS="$TAGS,${{ env.IMAGE }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      # Signs the digest this build step actually produced, not the tag -
      # steps.build.outputs.digest is what makes that possible
      - name: sign the image digest
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
      # Proves the workflow's own signature is verifiable before calling the
      # job done, not just producing a signature and trusting it's correct
      - name: verify the pushed signature
        run: |
          cosign verify ${{ env.IMAGE }}@${{ steps.build.outputs.digest }} \
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/publish.yml@${{ github.ref }}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
