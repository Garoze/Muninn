name: cut-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.4.0 (no prerelease suffix)'
        required: true
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - name: guard - must be dispatched from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "cut-release must be run with 'main' selected as the branch to run the workflow from." >&2
          exit 1
      - name: validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like vX.Y.Z with no prerelease suffix (got: ${{ inputs.version }})" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # develop's CHANGELOG.md accumulates one heading per alpha
      # release-please cuts. main should show official releases only -
      # each one consolidating everything since the previous official
      # release, not the individual alphas along the way. main requires a
      # PR, so this can't just push the fix directly; it opens one and
      # merges it immediately (0 approvals required on main).
      - name: consolidate the changelog for this release
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          stripped="${{ inputs.version }}"
          stripped="${stripped#v}"
          python3 hack/consolidate-changelog.py CHANGELOG.md "$stripped"
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="cut-release/changelog-${{ inputs.version }}"
          git checkout -b "$branch"
          git add CHANGELOG.md
          git commit \
            -m "docs: consolidate the changelog for ${{ inputs.version }}" \
            -m "- Merges every alpha entry since the last official release into one ${{ inputs.version }} entry, dropping the individual alpha headings - main's changelog shows official releases only."
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: consolidate the changelog for ${{ inputs.version }}" \
            --body "Merges every alpha entry since the last official release into one ${{ inputs.version }} entry, part of cutting this release."
          gh pr merge "$branch" --merge --delete-branch
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # the local checkout is still on the side branch created above; the tag
      # needs to land on main's new tip, changelog fix included.
      - name: sync with the changelog update
        if: steps.changelog.outputs.changed == 'true'
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            --title "${{ inputs.version }}" \
            --generate-notes

      # same loop-prevention gap as release-please.yml - the tag push above
      # won't trigger publish.yml on its own, so dispatch it explicitly.
      - name: trigger publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml \
          --ref "${{ inputs.version }}" \
          -f tag="${{ inputs.version }}"
      # release-please's manifest on develop has no awareness of tags cut
      # here - left alone, its next run continues the prerelease line this
      # version was cut from instead of a line above it, producing a version
      # that sorts before the release just published. Resetting the
      # manifest to the version just cut makes the next alpha compute above
      # it, the same way "sync with the changelog update" keeps main's tip
      # accurate after the step before it.
      - name: resync develop's release-please manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stripped="${{ inputs.version }}"
          stripped="${stripped#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          branch="cut-release/resync-manifest-${{ inputs.version }}"
          git checkout -b "$branch" origin/develop
          printf '{\n    ".": "%s"\n}\n' "$stripped" > .release-please-manifest.json
          if git diff --quiet -- .release-please-manifest.json; then
            exit 0
          fi
          git add .release-please-manifest.json
          git commit \
            -m "chore(release-please): resync manifest to ${{ inputs.version }}" \
            -m "- Sets the manifest to the version just cut from main, so the next alpha computes above it instead of continuing the prerelease line it was cut from."
          git push origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "chore(release-please): resync manifest to ${{ inputs.version }}" \
            --body "Sets the release-please manifest to ${{ inputs.version }}, the version just cut from main, so the next alpha computes above it instead of continuing the prerelease line it was cut from."
          gh pr merge "$branch" --merge --delete-branch
      # main-exclusive commits (this cut's tag, the changelog consolidation)
      # never become reachable from develop just because develop was merged
      # into main earlier - a develop->main PR only advances main's own
      # ref, develop's ref never moves. Without this, release-please can
      # never find the version its manifest now references, since the
      # commit it needs is not in develop's own ancestry at all.
      #
      # CHANGELOG.md always conflicts here by design: develop keeps every
      # alpha heading, main consolidates them, so the same content is
      # grouped differently on each side. hack/resolve-changelog-backmerge.py
      # resolves it by comparing develop's current file against develop's
      # own file at the merge-base - anything not present there yet is
      # genuinely new since the last sync and is kept; everything else
      # comes from main, which is authoritative for already-released
      # history. .release-please-manifest.json conflicts the opposite way -
      # develop's own copy is authoritative there, since only develop's
      # runs ever read it; main's copy is just an inherited byproduct of
      # the last forward merge. Any other conflicted file is unexpected and
      # fails the job rather than guessing at a resolution.
      - name: back-merge main into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          branch="cut-release/backmerge-${{ inputs.version }}"
          git checkout -b "$branch" origin/develop

          merge_base="$(git merge-base origin/develop origin/main)"
          git show "$merge_base:CHANGELOG.md" > /tmp/changelog-base.md 2>/dev/null || : > /tmp/changelog-base.md
          git show origin/develop:CHANGELOG.md > /tmp/changelog-develop.md
          git show origin/main:CHANGELOG.md > /tmp/changelog-main.md

          set +e
          git merge origin/main --no-commit -m "Merge main into develop"
          merge_status=$?
          set -e

          if [ $merge_status -ne 0 ]; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            for f in $conflicted; do
              case "$f" in
                CHANGELOG.md)
                  python3 hack/resolve-changelog-backmerge.py \
                    /tmp/changelog-develop.md /tmp/changelog-base.md /tmp/changelog-main.md CHANGELOG.md
                  git add CHANGELOG.md
                  ;;
                .release-please-manifest.json)
                  git checkout --ours .release-please-manifest.json
                  git add .release-please-manifest.json
                  ;;
                *)
                  echo "unexpected conflict in $f during the back-merge - needs manual resolution" >&2
                  exit 1
                  ;;
              esac
            done
          fi

          git commit \
            -m "Merge main into develop" \
            -m "- Brings ${{ inputs.version }}'s tag commit into develop's own ancestry, so release-please can find it. A develop -> main PR only advances main's ref; develop never sees main's exclusive commits without this in the other direction too."
          git push origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "Merge main into develop: bring ${{ inputs.version }} back into develop's ancestry" \
            --body "Brings ${{ inputs.version }}'s tag commit into develop's own ancestry, so release-please can find it. CHANGELOG.md and .release-please-manifest.json conflicts, if any, were resolved automatically - see the workflow run for details."
          gh pr merge "$branch" --merge --delete-branch
