name: ci

on:
  push:
    # develop as well as main: it is where prereleases are tagged from, so a
    # commit reaching it unchecked can be published.
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned rather than @latest: an upstream release should not change what
      # this job enforces without a commit that says so.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run ./...

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      # These run once per release against real history, where a defect is
      # awkward to undo, and no other tier exercises them.
      - name: release scripts
        run: python3 hack/consolidate_changelog_test.py
      # A tag is a mutable reference, and one of these workflows holds the
      # identity that signs releases. The trailing version comment is what
      # keeps the pin readable and what Dependabot rewrites on a bump.
      - name: actions are pinned to a commit SHA
        run: |
          unpinned=$(grep -rnE "^[[:space:]]*-?[[:space:]]*uses:" .github/workflows/ \
            | grep -vE "uses: [^@]+@[0-9a-f]{40} # v" || true)
          if [ -n "$unpinned" ]; then
            echo "actions must be pinned to a 40-character commit SHA:"
            echo "$unpinned"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./... -short

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned rather than @latest, same reasoning as golangci-lint above:
      # matches the controller-runtime version pinned in go.mod.
      - name: install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.1
      - name: fetch envtest binaries (etcd, kube-apiserver)
        run: echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path)" >> "$GITHUB_ENV"
      # The webhook RBAC tests render the chart to get the exact grants a
      # real install applies, so helm is a prerequisite of this tier now.
      # Without it those tests skip rather than fail, which would lose the
      # coverage silently.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      # The same target a developer runs, so CI and local runs cover the same
      # tests rather than drifting to different subsets.
      - run: make test-integration

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # govulncheck-action sets up Go itself below - a separate setup-go
      # step here collides with its cache restore once the cache is warm.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      # Installs ct, yamllint, and yamale onto the runner - the
      # chart-testing project's own action, not hand-rolled. It does not
      # install helm itself, hence the separate step above.
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # helm-unittest ships no provenance file for its releases, so
      # --verify=false is unavoidable, not a downgrade from some stronger
      # option. Pinned rather than @latest, same reasoning as every other
      # tool in this file.
      - name: install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.8.2 --verify=false
      - name: helm unittest
        run: helm unittest charts/muninn
      # The chart's README is generated from values.yaml's comments. A values
      # change without a regenerated README is the drift this exists to
      # prevent, so the check is a regeneration and a diff rather than a
      # reviewer noticing.
      - name: chart README is current
        run: |
          make chart-docs
          git diff --exit-code -- charts/muninn/README.md
      - name: install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      # Both steps below need these: "helm dependency build" resolves a
      # dependency only through helm's registered repository list, unlike
      # "helm dependency update", which reads the URLs straight from
      # Chart.yaml. ct shells out to the former, and so does the step here.
      - name: register subchart repositories
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
      - name: fetch chart dependencies
        run: helm dependency build charts/muninn
      # helm lint (which ct lint also runs) renders default values only, so
      # a template that only breaks under a non-default combination passes
      # it clean. Each combination here is a real value this chart accepts.
      - name: kubeconform against every certificate mode and secrets state
        run: |
          set -e
          check() {
            helm template muninn charts/muninn -n muninn-system "$@" | \
              kubeconform -strict -summary -kubernetes-version 1.31.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          }
          check
          check --set secrets.enabled=true --set secrets.spcMode=Create
          check --set secrets.enabled=true --set secrets.spcMode=Reference
          check --set certificate.mode=self-signed
          check --set certificate.mode=provided --set certificate.provided.caBundle=dGVzdA==
      - name: ct lint
        run: ct lint --config .github/ct.yaml
